# ==============================================================================
# Id10T Maison de Luxe - Production Nginx Reverse Proxy Configuration
# Reverse proxy routing for Frontend (Vite), Backend (Express API), Cookies,
# SSL, Gzip compression, and Rate Limiting.
# ==============================================================================

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate Limiting Zone: 20 requests/second per IP for API endpoints
    limit_req_zone $binary_remote_addr zone=royal_api_limit:10m rate=20r/s;

    # Gzip Compression for Ultra-Fast Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Upstream Backend Pool (Node.js + Express API)
    upstream id10t_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # Upstream Frontend Pool (Vite Dev / Preview Server)
    upstream id10t_frontend {
        server 127.0.0.1:5173;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost royalvault.id10t.com;

        # Global Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # Backend API Routing (/api/ -> Node.js Express)
        # ----------------------------------------------------------------------
        location /api/ {
            # Rate limiting with burst buffer
            limit_req zone=royal_api_limit burst=10 nodelay;

            proxy_pass http://id10t_backend;
            proxy_http_version 1.1;

            # HTTP-Only Cookie and Header Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            # Cookie Security Attribute Rewriting
            proxy_cookie_path / "/; HttpOnly; SameSite=Lax";

            # Timeout Settings for Long-Polling / WebSockets
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Frontend UI & Static Asset Routing (/ -> Vite Dev / Static Dist)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://id10t_frontend;
            proxy_http_version 1.1;

            # WebSocket support for Vite HMR (Hot Module Replacement)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache Static Assets
            location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
                proxy_pass http://id10t_frontend;
                expires 7d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # Custom Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
