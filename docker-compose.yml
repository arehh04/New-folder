version: '3.8'

services:
  # 1. High-Performance In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: royal_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 2. Sovereign REST API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: royal_backend_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=sovereign_royal_jwt_vault_key_production
    ports:
      - "5000:5000"
    depends_on:
      - redis

  # 3. Nginx Reverse Proxy & Static Web Server
  web:
    image: nginx:alpine
    container_name: royal_web_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  redis_data:
